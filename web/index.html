<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <!-- 移动端viewport优化：禁止缩放、适配刘海屏 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!-- 主题色：与页面背景一致 -->
  <meta name="theme-color" content="#0f172a">
  <meta name="color-scheme" content="dark">
  <style>html{background:#f8fafc;color-scheme:light}html.dark{background:#0f172a;color-scheme:dark}body{background-color:inherit}</style>
  <script>
    (() => {
      let dark = true
      try { dark = localStorage.getItem('theme') !== 'light' } catch (_) {}
      document.documentElement.classList.toggle('dark', dark)
      document.querySelector('meta[name="theme-color"]').content = dark ? '#0f172a' : '#f8fafc'
      document.querySelector('meta[name="color-scheme"]').content = dark ? 'dark' : 'light'
    })()
  </script>
  <!-- iOS PWA支持 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- 禁用电话号码自动识别 -->
  <meta name="format-detection" content="telephone=no">
  <title>5G-MIFI 管理中心</title>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
