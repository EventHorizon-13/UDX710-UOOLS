name: Build UDX710 Tools

on:
  push:
  workflow_dispatch:

jobs:
  build-arm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          curl -fsSL https://deb.nodesource.com/setup_lts.x | sudo -E bash -
          sudo apt-get update
          sudo apt-get install -y nodejs libglib2.0-dev

      - name: Test CW52 validation and client records (runner only)
        run: |
          set -euo pipefail
          for test in lan wifi_clients; do
            gcc -std=gnu11 -Wall -Wextra -Wno-unused-function -g -fsanitize=address,undefined \
              -ffunction-sections -fdata-sections -Wl,--gc-sections \
              -Isrc -Isrc/include/lib -Isrc/include/system \
              $(pkg-config --cflags gio-2.0) \
              "tests/${test}_test.c" src/mongoose.c src/system/json_builder.c \
              $(pkg-config --libs gio-2.0) -o "/tmp/${test}_test"
            "/tmp/${test}_test"
          done

      - name: Cache cross compiler (aarch64)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/tools/gcc-linaro-7.5.0-2019.12-x86_64_aarch64-linux-gnu
          key: gcc-linaro-7.5.0-2019.12-x86_64_aarch64-linux-gnu

      - name: Configure cross compiler (aarch64)
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/tools"
          TOOLCHAIN_DIR="$GITHUB_WORKSPACE/tools/gcc-linaro-7.5.0-2019.12-x86_64_aarch64-linux-gnu"
          ARCHIVE="gcc-linaro-7.5.0-2019.12-x86_64_aarch64-linux-gnu.tar.xz"

          if [ ! -x "$TOOLCHAIN_DIR/bin/aarch64-linux-gnu-gcc" ]; then
            curl --fail --location --retry 3 --retry-all-errors \
              "https://huggingface.co/csukuangfj/sherpa-ncnn-toolchains/resolve/main/$ARCHIVE?download=true" \
              --output "$GITHUB_WORKSPACE/$ARCHIVE"
            echo "30c7a2ef1a268d1231fb441ee832eb6f  $GITHUB_WORKSPACE/$ARCHIVE" | md5sum --check -
            tar -xJf "$GITHUB_WORKSPACE/$ARCHIVE" -C "$GITHUB_WORKSPACE/tools"
            rm "$GITHUB_WORKSPACE/$ARCHIVE"
          fi

          test -x "$TOOLCHAIN_DIR/bin/aarch64-linux-gnu-gcc"
          test -x "$TOOLCHAIN_DIR/bin/aarch64-linux-gnu-strip"
          echo "$TOOLCHAIN_DIR/bin" >> "$GITHUB_PATH"

      - name: build web
        run: |
          cd web
          npm install && npm run build

      - name: build server
        run: |
          cd src
          make

      - name: dopack
        run: |
          mkdir -p output/6677
          echo "#!/bin/sh" > start.sh
          echo "cd /home/root/6677" >> start.sh
          echo "chmod 755 *" >> start.sh
          echo "./server &" >> start.sh
          mv start.sh output/6677/
          cp -r web/dist output/6677/
          cp src/build/ofono-server output/6677/server

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: udx710-tools
          path: output
